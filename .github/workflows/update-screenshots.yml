# Weekly screenshot refresh. Regenerates every screenshot and opens an issue only when one of
# them meaningfully changed, judged by a pixel diff with a tolerance rather than by bytes. It
# never pushes; a person regenerates the screenshots locally and commits them.
#
# All logic lives in scripts/refresh-screenshots.sh, which runs the same way locally:
#
#   scripts/refresh-screenshots.sh                   # regenerate and compare
#   scripts/refresh-screenshots.sh --compare-only    # compare what is already on disk
#   scripts/refresh-screenshots.sh --threshold 0.005 # stricter tolerance
#
# It exits 0 when nothing meaningful changed and 2 when there is something to review, and
# leaves diff images in .screenshot-diffs.

name: Update screenshots

on:
  schedule:
    - cron: '0 8 * * 1'  # every Monday at 08:00 UTC
  workflow_dispatch:
    inputs:
      threshold:
        description: differing-pixel ratio that counts as a real change
        required: false
        default: '0.02'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            screenshots/package-lock.json

      - name: Install site modules
        run: npm ci

      - name: Install screenshots CLI
        run: npm ci
        working-directory: ./screenshots

      - name: Install Playwright webkit
        run: npx playwright install webkit --with-deps
        working-directory: ./screenshots

      - name: Regenerate and compare
        id: refresh
        run: |
          set +e
          scripts/refresh-screenshots.sh --threshold "${{ inputs.threshold || '0.02' }}" 2>&1 | tee "$RUNNER_TEMP/refresh.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 1 ] || [ "$status" -gt 2 ]; then exit 1; fi
          echo "changed=$([ "$status" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload diff images
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: .screenshot-diffs/
          if-no-files-found: ignore

      # one open issue at a time: open it, comment while screenshots still differ, close it once they match
      - name: Open or update the screenshots issue
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          THRESHOLD: ${{ inputs.threshold || '0.02' }}
        run: |
          TITLE="Screenshots are out of date"
          {
            printf 'The screenshot refresh in [this run](%s) found screenshots that changed beyond the tolerance. Diff images are in its `screenshot-diffs` artifact.\n\n' "$RUN_URL"
            printf 'To update them, run this from the repo root, review the changes, and open a PR:\n\n```bash\nscripts/refresh-screenshots.sh --threshold %s\n```\n\n' "$THRESHOLD"
            printf '### Comparison\n\n```\n'
            sed -n '/^Comparing /,$p' "$RUNNER_TEMP/refresh.log"
            printf '```\n'
          } > "$RUNNER_TEMP/issue-body.md"
          cat "$RUNNER_TEMP/issue-body.md"
          gh label create screenshots --repo "$REPO" --force --color 0E8A16 --description "Screenshot refresh"
          issue=$(gh issue list --repo "$REPO" --label screenshots --state open --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$REPO" --body-file "$RUNNER_TEMP/issue-body.md"
          else
            gh issue create --repo "$REPO" --label screenshots --title "$TITLE" --body-file "$RUNNER_TEMP/issue-body.md"
          fi

      - name: Close the screenshots issue
        if: steps.refresh.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --repo "$REPO" --label screenshots --state open --json number,title \
            --jq 'map(select(.title == "Screenshots are out of date"))[0].number // empty')
          [ -z "$issue" ] || gh issue close "$issue" --repo "$REPO" --comment "Screenshots match again: $RUN_URL"

      - name: No changes
        if: steps.refresh.outputs.changed == 'false'
        run: echo "All screenshots within tolerance, so there's nothing to update."
