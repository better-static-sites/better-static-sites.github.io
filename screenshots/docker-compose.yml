services:
  bss-docs:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../dist:/app/dist:ro
    command: sh -c "test -f /app/dist/index.html || { echo 'dist/ not built -- run npm run screenshots from the project root'; exit 1; }; npx --yes serve dist -l 4000 --no-clipboard"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/"]
      interval: 3s
      timeout: 5s
      retries: 30
